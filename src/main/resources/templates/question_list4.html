<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>질문 목록4</title>
</head>
<body>
  <h1>질문 목록</h1>

    <table>
      <thead>
      <tr>
          <th>번호</th>
          <th>제목</th>
          <th>작성일시</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="q : ${questions}">
          <td th:text="${q.id}"></td>
          <td th:text="${q.subject}"></td>
          <td th:text="${q.createDate}"></td>
      </tr>
      </tbody>
    </table>
</body>
</html>
